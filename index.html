<!DOCTYPE html>
<html lang="id">

<head>
    <!-- Pengaturan karakter -->
    <meta charset="UTF-8">

    <!-- Agar tampilan menyesuaikan HP -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Nama aplikasi -->
    <title>DIGI-UF</title>

    <!-- File CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">

    <!-- Warna bagian browser -->
    <meta name="theme-color" content="#0f766e">
</head>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DIGI-UF | Digital Ultrafiltration Rate Calculator</title>

  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>

<body>

  <main class="app">

    <h1>DIGI-UF</h1>

    <p>
      Digital Ultrafiltration Rate Calculator
    </p>


    <!-- =========================
         DATA PASIEN
    ========================== -->

    <h2>Data Pasien</h2>


    <label for="kodeSesi">
      Kode Sesi
    </label>

    <input
      type="text"
      id="kodeSesi"
      placeholder="Contoh: HD001"
    >


    <label for="bb">
      Berat Badan (kg)
    </label>

    <input
      type="number"
      id="bb"
      placeholder="Contoh: 60"
      min="0"
      step="0.1"
    >


    <label for="uf">
      UF yang Direncanakan (mL)
    </label>

    <input
      type="number"
      id="uf"
      placeholder="Contoh: 3000"
      min="0"
      step="1"
    >


    <label for="durasi">
      Durasi Hemodialisis (jam)
    </label>

    <input
      type="number"
      id="durasi"
      placeholder="Contoh: 4"
      min="0"
      step="0.5"
    >


    <label for="threshold">
      Threshold High UFR (mL/kg/jam)
    </label>

    <input
      type="number"
      id="threshold"
      value="13"
      min="0"
      step="0.1"
    >


    <!-- =========================
         TOMBOL HITUNG
    ========================== -->

    <button
      type="button"
      onclick="hitungUFR()"
    >
      HITUNG UFR
    </button>


    <!-- =========================
         HASIL
    ========================== -->

    <div id="hasil"></div>


    <!-- =========================
         RIWAYAT
    ========================== -->

    <h2>
      Riwayat Skrining
    </h2>

    <div id="riwayat">
      Belum ada data skrining.
    </div>

  </main>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="./script.js"></script>

</body>

</html>
